<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darrilla Software splash preview</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background: #203647;
    font-family: Trebuchet MS, Arial, sans-serif;
  }
  .screen {
    position: relative;
    width: min(100vw, 56.25vh);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: radial-gradient(circle at 50% 28%, #ddf7fa 0, #9bd8ed 37%, #4ba6d9 100%);
    isolation: isolate;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 64%, transparent 35%, #176b9929 100%);
    pointer-events: none;
  }
  .sun {
    position: absolute;
    top: 9%; left: 13%;
    width: 24%;
    aspect-ratio: 1;
    border: .48em solid #ffca23;
    border-radius: 50%;
    background: #fff188;
    box-shadow: 0 0 0 .7em #ffe56665, 0 0 2.5em 1.7em #fff36ca8;
    animation: sun 3.4s ease-out both;
  }
  .sun::before, .sun::after {
    content: "";
    position: absolute;
    top: 38%;
    width: 8%; height: 8%;
    border-radius: 50%;
    background: #ec9a00;
  }
  .sun::before { left: 30%; }
  .sun::after { right: 30%; }
  .smile {
    position: absolute;
    left: 39%; top: 45%;
    width: 23%; height: 19%;
    border-bottom: .22em solid #ec9a00;
    border-radius: 0 0 50% 50%;
  }
  .mascot {
    position: absolute;
    width: 82%;
    left: 9%; top: 22%;
    filter: drop-shadow(0 1.3em 1em #12496970);
    transform-origin: center bottom;
    animation: mascot 3.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .brand {
    position: absolute;
    left: 5%; right: 5%; bottom: 15%;
    text-align: center;
    color: #fff9e7;
    text-shadow: 0 .07em .13em #145473b0;
    animation: brand 3.4s ease-out both;
  }
  .brand strong {
    display: block;
    font-size: clamp(2rem, 8vw, 3.6rem);
    line-height: .95;
    letter-spacing: -.055em;
  }
  .brand span {
    display: block;
    margin-top: .55em;
    font-size: clamp(.9rem, 3.4vw, 1.45rem);
    font-weight: 700;
    letter-spacing: .35em;
    text-indent: .35em;
  }
  button {
    position: absolute;
    right: 4%; bottom: 3%;
    z-index: 2;
    padding: .55em .8em;
    border: 1px solid #ffffff8c;
    border-radius: 999px;
    background: #164f6b95;
    color: white;
    font: inherit;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #173347; outline-offset: 3px; }
  .replay .sun, .replay .mascot, .replay .brand { animation: none; }
  @keyframes sun {
    0% { opacity: 0; transform: scale(.7) rotate(-18deg); }
    32% { opacity: 1; transform: scale(1.07) rotate(5deg); }
    47%, 100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes mascot {
    0%, 16% { opacity: 0; transform: translateY(18%) scale(.86); }
    52% { opacity: 1; transform: translateY(-2%) scale(1.03); }
    67%, 100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes brand {
    0%, 55% { opacity: 0; transform: translateY(.7em); }
    84%, 100% { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sun, .mascot, .brand { animation: none; }
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="sun"><div class="smile"></div></div>
  <img class="mascot" src="/assets/images/darrilla-mascot.webp" alt="Smiling Darrilla mascot">
  <div class="brand"><strong>Darrilla</strong><span>SOFTWARE</span></div>
  <button type="button" onclick="const panel = document.getElementById('screen'); panel.classList.add('replay'); requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.remove('replay')))">Replay</button>
</div>
</body>
</html>
