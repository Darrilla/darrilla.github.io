<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.home %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="name" href="{{ '/' | relative_url }}">Darrell Burns<span>Personal website</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="https://github.com/Darrilla">GitHub</a>
      <a href="https://darrilla.com/">Darrilla Software <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main"{% unless page.home %} class="page"{% endunless %}>
    {% unless page.home %}<h1>{{ page.title | escape }}</h1>{% endunless %}
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ site.time | date: '%Y' }} Darrell Burns</p>
    <p>Games and apps live at <a href="https://darrilla.com/">Darrilla Software</a>.</p>
  </footer>
</body>
</html>
